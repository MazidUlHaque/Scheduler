name: Release

# Builds a signed release when a version tag is pushed, e.g. `git tag v1.0.0 && git push origin v1.0.0`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Signed release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: Restore the signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KOKHON_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The KOKHON_KEYSTORE_BASE64 secret is missing. See docs/releasing.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kokhon-release.jks"
          echo "KOKHON_KEYSTORE_FILE=$RUNNER_TEMP/kokhon-release.jks" >> "$GITHUB_ENV"

      - name: Test
        run: ./gradlew test

      - name: Build signed App Bundle and APK
        env:
          KOKHON_KEYSTORE_PASSWORD: ${{ secrets.KOKHON_KEYSTORE_PASSWORD }}
          KOKHON_KEY_ALIAS: ${{ secrets.KOKHON_KEY_ALIAS }}
          KOKHON_KEY_PASSWORD: ${{ secrets.KOKHON_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease

      - name: Name the files
        run: |
          mkdir -p dist
          cp app/build/outputs/bundle/release/app-release.aab "dist/kokhon-${GITHUB_REF_NAME}.aab"
          cp app/build/outputs/apk/release/app-release.apk "dist/kokhon-${GITHUB_REF_NAME}.apk"

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/kokhon-release.jks"
